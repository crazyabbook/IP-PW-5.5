<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Калькулятор стоимости визиток</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
        <link rel="stylesheet" href="design.css">
    </head>
    <body class="bg-light">
        <div class="container mt-5">
            <h1 class="text-center">Калькулятор стоимости визиток</h1>
            <div class="row">
                <div class="col-12 col-md-6">
                    <div class="calc my-5 px-5 py-4 bg-white rounded-5 shadow">
                        <h3 class="mb-4">Расчет стоимости</h3>
                        <label for="card-color">Цветность:</label>
                        <select id="card-color" class="form-control mt-2 mb-3"></select>
                        <label for="card-paper">Бумага:</label>
                        <select id="card-paper" class="form-control mt-2 mb-3"></select>
                        <label for="card-quantity">Количество:</label>
                        <input id="card-quantity" type="number" min="30" step="30" class="form-control mt-2">
                        <h3 class="mt-4">Итоговая стоимость – <span id="final-price">0</span> ₽</h3>
                    </div>
                </div>
                <div class="img-block col-12 col-md-6 my-5">
                    <img id="card_1_0" src="images/1_0.png">
                    <img id="card_1_1" src="images/1_1.png">
                    <img id="card_4_0" src="images/4_0.png">
                    <img id="card_4_1" src="images/4_1.png">
                    <img id="card_4_4" src="images/4_4.png">
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
